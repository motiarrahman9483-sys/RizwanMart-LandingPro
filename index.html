<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rizwan Mart | Premium Shopping</title>
    <meta name="description" content="Order premium quality products with Cash On Delivery all over Bangladesh.">
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <header class="top-bar">
        <div class="container">
            <div class="logo">
                <h2>Rizwan Mart</h2>
            </div>
            <div class="top-right">
                <span>🚚 Cash On Delivery</span>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container hero-grid">
            <div class="hero-left">
                <span class="offer">🔥 LIMITED TIME OFFER</span>
                <h1 id="productName">Loading...</h1>
                <p id="productShort">Please wait, loading product details.</p>
                <div class="price-box">
                    <h2>৳ <span id="price">...</span></h2>
                    <del>৳ <span id="oldPrice">...</span></del>
                    <span class="discount">38% OFF</span> 
                </div>
                <button class="buy-btn">অর্ডার করুন</button>
            </div>
            <div class="hero-right">
                <img id="mainImage" src="" alt="Premium Product" loading="lazy">
            </div>
        </div>
    </section>

    <section class="gallery">
        <div class="container">
            <h2>Product Gallery</h2>
            <div class="gallery-grid"></div>
        </div>
    </section>

    <section class="features">
        <div class="container">
            <h2>Why Choose This Product?</h2>
            <div class="feature-grid"></div>
        </div>
    </section>

    <section class="packages">
        <div class="container">
            <h2>Choose Package</h2>
            <div class="package-grid"></div>
        </div>
    </section>

    <section class="reviews">
        <div class="container">
            </div>
    </section>

    <section class="faq">
        <div class="container">
            </div>
    </section>

    <section id="order">
        <div class="container">
            <h2>Order Now</h2>
            <form id="orderForm">
                
                <input type="text" name="name" placeholder="আপনার নাম" required>
                
                <input type="tel" name="phone" placeholder="মোবাইল নাম্বার" required>
                
                <textarea name="address" placeholder="সম্পূর্ণ ঠিকানা" required></textarea>
                
                <select name="quantity">
                    <option value="১ পিস">১ পিস</option>
                    <option value="২ পিস">২ পিস</option>
                    <option value="৩ পিস">৩ পিস</option>
                </select>
                
                <button type="submit">অর্ডার কনফার্ম করুন</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>© 2026 Rizwan Mart</p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>

</body>
</html>
